<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База данных - Dashboard</title>
<link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-dark-900 via-dark-800 to-dark-900 min-h-screen text-white">
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    
    <custom-navbar></custom-navbar>

    <main class="container mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl md:text-4xl font-bold">База данных</h1>
            <a href="/" class="btn-primary">Назад на главную</a>
        </div>

        <div class="bg-dark-800/50 backdrop-blur-lg rounded-2xl p-6 border border-dark-700">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold">Пользователи</h2>
                <div class="flex items-center gap-3">
                    <button id="toggleSelectionBtn" class="btn-secondary">
                        <i data-feather="check-square" class="w-4 h-4"></i>
                        Выделение
                    </button>
                    <button id="toggleSearchBtn" class="btn-secondary">
                        <i data-feather="search" class="w-4 h-4"></i>
                        Поиск
                    </button>
                </div>
            </div>
            
            <!-- Панель управления выделением -->
            <div id="selectionPanel" class="hidden mb-4">
                <div class="bg-blue-900/20 border border-blue-500/30 rounded-lg p-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-blue-300">Выделено:</span>
                                <span id="selectedCount" class="bg-blue-600 text-white px-2 py-1 rounded-full text-sm font-medium">0</span>
                            </div>
                            <div id="selectedUsersTooltip" class="relative group">
                                <button class="text-blue-400 hover:text-blue-300 text-sm underline">
                                    <i data-feather="info" class="w-4 h-4 inline mr-1"></i>
                                    Показать выделенных
                                </button>
                                <div class="absolute bottom-full left-0 mb-2 bg-dark-800 border border-dark-600 rounded-lg p-3 shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-10 min-w-64">
                                    <div id="selectedUsersList" class="text-sm text-white">
                                        Нет выделенных пользователей
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="clearSelectionBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                                <i data-feather="x" class="w-4 h-4"></i>
                                Сбросить выделение
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Форма поиска -->
            <div id="searchForm" class="hidden mb-6">
                <div class="bg-dark-700/50 rounded-lg p-4 border border-dark-600">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold">Поиск по базе данных</h3>
                        <button id="addSearchFieldBtn" class="btn-primary text-sm">
                            <i data-feather="plus" class="w-4 h-4"></i>
                            Добавить поле
                        </button>
                    </div>
                    
                    <div id="searchFieldsContainer">
                        <!-- Поля поиска будут добавляться здесь -->
                    </div>
                    
                    <div class="flex items-center gap-3 mt-4 flex-wrap">
                        <button id="searchBtn" class="search-action-btn search-btn">
                            <i data-feather="search" class="w-4 h-4"></i>
                            Найти
                        </button>
                        <button id="clearSearchBtn" class="search-action-btn clear-btn">
                            <i data-feather="refresh-cw" class="w-4 h-4"></i>
                            Очистить
                        </button>
                        <button id="closeSearchBtn" class="search-action-btn close-btn">
                            <i data-feather="x" class="w-4 h-4"></i>
                            Закрыть
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="tableContainer">
                <!-- Таблица будет загружена здесь -->
            </div>
            
            <div id="loadingIndicator" class="text-center py-8 hidden">
                <div class="inline-flex items-center gap-2 text-dark-300">
                    <i data-feather="loader" class="w-4 h-4 animate-spin"></i>
                    Загрузка данных...
                </div>
            </div>
            
            <div id="errorMessage" class="text-center py-8 hidden">
                <div class="text-red-400">
                    <i data-feather="alert-circle" class="w-6 h-6 mx-auto mb-2"></i>
                    <p>Ошибка загрузки данных</p>
                </div>
            </div>
            
            <div id="paginationContainer" class="mt-6">
                <!-- Пагинация будет загружена здесь -->
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <script src="database-page.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
