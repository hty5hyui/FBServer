<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запросы на обработку - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tailwind.js"></script>
    <script src="js/feather.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-dark-900 via-dark-800 to-dark-900 min-h-screen text-white">
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    
    <custom-navbar></custom-navbar>

    <main class="container mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl md:text-4xl font-bold">Запросы на обработку</h1>
            <a href="/" class="btn-primary">Назад на главную</a>
        </div>

        <div class="bg-dark-800/50 backdrop-blur-lg rounded-2xl p-6 border border-dark-700">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold">История запросов</h2>
                <div class="flex items-center gap-3">
                    <div class="text-sm text-dark-400">
                        <span id="recordsInfo">Записей: 0</span>
                    </div>
                    <button id="refreshBtn" class="btn-secondary">
                        <i data-feather="refresh-cw" class="w-4 h-4"></i>
                        Обновить
                    </button>
                </div>
            </div>

            <!-- Таблица запросов -->
            <div class="overflow-x-auto">
                <table class="w-full requests-table">
                    <colgroup>
                        <col style="width: 9rem;" />
                        <col style="width: 10rem;" />
                        <col style="width: 8rem;" />
                        <col style="width: 10rem;" />
                    </colgroup>
                    <thead>
                        <tr class="border-b border-dark-600">
                            <th class="text-left py-3 px-4 font-medium text-dark-300">Дата и время</th>
                            <th class="text-left py-3 px-4 font-medium text-dark-300">Тип запроса</th>
                            <th class="text-left py-3 px-4 font-medium text-dark-300">Статус</th>
                            <th class="text-left py-3 px-4 font-medium text-dark-300">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody">
                        <!-- Данные будут загружены через JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Состояние загрузки -->
            <div id="loadingState" class="hidden text-center py-8">
                <div class="inline-flex items-center gap-2 text-dark-400">
                    <i data-feather="loader" class="w-4 h-4 animate-spin"></i>
                    Загрузка запросов...
                </div>
            </div>

            <!-- Состояние ошибки -->
            <div id="errorState" class="hidden text-center py-8">
                <div class="text-red-400 mb-4">
                    <i data-feather="alert-circle" class="w-8 h-8 mx-auto mb-2"></i>
                    <p id="errorMessage">Ошибка загрузки данных. Попробуйте обновить страницу.</p>
                </div>
                <button id="retryBtn" class="btn-primary">Попробовать снова</button>
            </div>

            <!-- Пагинация -->
            <div id="paginationContainer" class="hidden mt-6">
                <div class="flex items-center justify-between">
                    <div class="text-sm text-dark-400">
                        <span id="paginationInfo">Страница 1 из 1</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="prevPageBtn" class="btn-secondary disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <i data-feather="chevron-left" class="w-4 h-4"></i>
                            Предыдущая
                        </button>
                        <div id="pageNumbers" class="flex items-center gap-1">
                            <!-- Номера страниц будут добавлены через JavaScript -->
                        </div>
                        <button id="nextPageBtn" class="btn-secondary disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            Следующая
                            <i data-feather="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <script src="script.js"></script>
    <script src="js/requests-page.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
